# 5-fold cross-validation with matched optimizer updates (reviewer + robustness)

single_species_path: "data/SingleSpecies"
overlapping_species_path: "data/OverlappingSpecies"
output_dir: "outputs"

n_folds: 5
seed: 42
match_total_updates: true

phase1_epochs: 50
phase2_epochs: 50
phase1_fraction: 0.5

batch_size: 16
encode_batch_size: 8
eval_every_n_steps: null

phase1_learning_rate: 1.0e-4
phase2_learning_rate: 5.0e-6
learning_rate: 1.0e-4

# Quick smoke test (use --experiment cv5fold-quick)
quick_phase1_epochs: 2
quick_phase2_epochs: 2
